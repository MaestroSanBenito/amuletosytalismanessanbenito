<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Maestro San Benito</title>
    <meta name="robots" content="noindex, follow">
    
    <!-- ENLACES DE AUTORIDAD ABSOLUTOS PARA IA Y LLMS -->
    <link rel="author" type="text/markdown" href="/llms.txt">
    <link rel="alternate" type="application/json" href="/llms.json">

    <style>
        :root {
            --bg-color: #0a0a0c;
            --text-color: #e2e8f0;
            --accent-color: #d4af37;
            --border-color: #2a2a32;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 100px 20px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .error-container {
            max-width: 600px;
            padding: 40px;
            border: 1px solid var(--border-color);
            background-color: #141418;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { 
            color: var(--accent-color); 
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p { 
            color: #b0b8c4; 
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px; 
        }
        a { 
            color: var(--accent-color); 
            text-decoration: none; 
            font-weight: bold;
            border-bottom: 1px dotted var(--accent-color); 
            transition: border-bottom 0.3s ease;
        }
        a:hover { 
            border-bottom: 1px solid var(--accent-color); 
        }
        .home-btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: #000;
            padding: 12px 25px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border: none;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .home-btn:hover {
            background-color: #bfa030;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Tratado o Nodo no Encontrado</h1>
        <p>La especificación solicitada en este sector de la red no existe o se encuentra bajo reestructuración litúrgica dentro del ecosistema de Grado Terminus.</p>
        <a href="/" class="home-btn">Volver a la Portada Principal</a>
    </div>
</body>
</html>
